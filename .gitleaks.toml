# The manifest key is the existing public SPKI used for a stable extension ID.
# Match only these exact public bytes in manifest.json; other keys remain checked.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "OZGuard public extension identity (not a private or API key)"
condition = "AND"
paths = ['''(^|[\\/])manifest\.json$''']
